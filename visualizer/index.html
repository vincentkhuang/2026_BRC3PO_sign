<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRC3PO Pattern Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111317;
      color: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { width: min(1180px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 600; }
    .subtitle { margin: 6px 0 20px; color: #a8adb7; }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.5fr) repeat(2, minmax(130px, 1fr));
      gap: 14px;
      align-items: end;
      margin-bottom: 16px;
    }
    label { display: grid; gap: 6px; color: #c8ccd4; font-size: 0.86rem; }
    select, input, button {
      font: inherit;
      color: inherit;
    }
    select, button {
      min-height: 40px;
      border: 1px solid #3a3f49;
      border-radius: 7px;
      background: #20242b;
      padding: 8px 10px;
    }
    button { cursor: pointer; }
    button:hover { background: #2a2f38; }
    button.primary { background: #f2bd3e; border-color: #f2bd3e; color: #17130a; }
    button.primary:hover { background: #ffd36d; }
    .button-row { display: flex; gap: 8px; }
    .button-row button { flex: 1; }
    .range-label { display: flex; justify-content: space-between; gap: 12px; }
    input[type="range"] { width: 100%; accent-color: #f2bd3e; }
    .stage {
      overflow: hidden;
      border: 1px solid #30343c;
      border-radius: 10px;
      background: #08090b;
    }
    canvas { display: block; width: 100%; aspect-ratio: 1000 / 370; }
    .transport {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid #30343c;
      background: #171a1f;
    }
    .status { color: #a8adb7; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      color: #a8adb7;
      font-size: 0.88rem;
    }
    .options label { display: flex; align-items: center; gap: 7px; }
    .message {
      min-height: 22px;
      margin-top: 12px;
      color: #f6c85f;
      font-size: 0.9rem;
    }
    code { color: #f7d98b; }
    @media (max-width: 760px) {
      body { padding: 14px; }
      .controls { grid-template-columns: 1fr; }
      .transport { grid-template-columns: 1fr; }
      .status { text-align: center; }
    }
  </style>
</head>
<body>
<main>
  <h1>BRC3PO Pattern Visualizer</h1>
  <p class="subtitle">Frames generated by the same C++ pattern functions used on the Teensy.</p>

  <section class="controls" aria-label="Playback controls">
    <label>
      Pattern
      <select id="pattern"></select>
    </label>
    <label>
      <span class="range-label"><span>Playback speed</span><output id="speed-value">1×</output></span>
      <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
    </label>
    <label>
      <span class="range-label"><span>Brightness</span><output id="brightness-value">96</output></span>
      <input id="brightness" type="range" min="0" max="255" step="1" value="96">
    </label>
  </section>

  <section class="stage" aria-label="LED sign preview">
    <canvas id="sign" width="1000" height="370" role="img" aria-label="Animated preview of the BRC3PO letters, underline, and mailbox flag"></canvas>
    <div class="transport">
      <div class="button-row">
        <button id="play" class="primary" type="button">Play</button>
        <button id="restart" type="button">Restart</button>
      </div>
      <input id="timeline" type="range" min="0" max="1" step="1" value="0" aria-label="Animation timeline">
      <div id="status" class="status">Loading…</div>
    </div>
  </section>

  <div class="options">
    <label><input id="origins" type="checkbox" checked> Show pixel 0 markers</label>
    <span>Approximate geometry; LED counts, colors, timing, fades, and sequence come from the C++ firmware.</span>
  </div>
  <div id="message" class="message" role="status"></div>
</main>

<script>
(() => {
  const PIXEL_COUNTS = [141, 119, 79, 94, 104, 128];
  const PIXEL_STARTS = [432, 288, 144, 0, 1008, 864];
  const LABELS = ["B", "R", "C", "3", "P", "O"];
  const FLAG_START = 576;
  const FLAG_COUNT = 143;
  const UNDERLINE_START = 720;
  const UNDERLINE_COUNT = 126;
  const HEADER_BYTES = 24;

  const canvas = document.getElementById("sign");
  const context = canvas.getContext("2d");
  const patternSelect = document.getElementById("pattern");
  const playButton = document.getElementById("play");
  const restartButton = document.getElementById("restart");
  const timeline = document.getElementById("timeline");
  const speedInput = document.getElementById("speed");
  const brightnessInput = document.getElementById("brightness");
  const speedValue = document.getElementById("speed-value");
  const brightnessValue = document.getElementById("brightness-value");
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const originsInput = document.getElementById("origins");

  let recording = null;
  let currentTime = 0;
  let playing = false;
  let playbackAnchor = 0;
  let timeAnchor = 0;
  let animationRequest = 0;

  function samplePolyline(points, count) {
    const lengths = [];
    let total = 0;
    for (let i = 1; i < points.length; i += 1) {
      const length = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      lengths.push(length);
      total += length;
    }
    const samples = [];
    for (let sample = 0; sample < count; sample += 1) {
      const target = (sample / Math.max(1, count - 1)) * total;
      let walked = 0;
      let segment = 0;
      while (segment < lengths.length - 1 && walked + lengths[segment] < target) {
        walked += lengths[segment];
        segment += 1;
      }
      const local = lengths[segment] === 0 ? 0 : (target - walked) / lengths[segment];
      samples.push({
        x: points[segment].x + (points[segment + 1].x - points[segment].x) * local,
        y: points[segment].y + (points[segment + 1].y - points[segment].y) * local
      });
    }
    return samples;
  }

  function arcPoints(cx, cy, rx, ry, start, end, steps) {
    return Array.from({ length: steps }, (_, index) => {
      const angle = start + (end - start) * (index / (steps - 1));
      return { x: cx + Math.cos(angle) * rx, y: cy + Math.sin(angle) * ry };
    });
  }

  function glyphPath(label) {
    if (label === "B") return [
      {x:0,y:1},{x:0,y:0},{x:.38,y:0},{x:.58,y:.08},{x:.58,y:.28},
      {x:.38,y:.43},{x:0,y:.43},{x:.4,y:.43},{x:.62,y:.56},{x:.62,y:.82},
      {x:.4,y:1},{x:0,y:1}
    ];
    if (label === "R") return [
      {x:0,y:1},{x:0,y:0},{x:.38,y:0},{x:.6,y:.1},{x:.6,y:.3},
      {x:.38,y:.44},{x:0,y:.44},{x:.32,y:.44},{x:.68,y:1}
    ];
    if (label === "C") return arcPoints(.48, .5, .48, .5, -.72, -5.56, 64);
    if (label === "3") {
      const upper = arcPoints(.22, .26, .44, .26, 2.3, 6.2, 34);
      const lower = arcPoints(.22, .74, .44, .26, .08, 3.98, 34);
      return upper.concat(lower);
    }
    if (label === "P") return [
      {x:0,y:1},{x:0,y:0},{x:.38,y:0},{x:.6,y:.1},{x:.6,y:.3},
      {x:.38,y:.44},{x:0,y:.44}
    ];
    return arcPoints(.5, .5, .48, .5, -Math.PI / 2, Math.PI * 1.5, 72);
  }

  function buildCoordinates() {
    const coordinateMap = new Map();
    LABELS.forEach((label, index) => {
      const x = 155 + index * 132;
      const y = 54;
      const width = 82;
      const height = 190;
      const path = glyphPath(label).map(point => ({ x: x + point.x * width, y: y + point.y * height }));
      const samples = samplePolyline(path, PIXEL_COUNTS[index]);
      samples.forEach((point, pixel) => coordinateMap.set(PIXEL_STARTS[index] + pixel, point));
    });

    for (let pixel = 0; pixel < UNDERLINE_COUNT; pixel += 1) {
      coordinateMap.set(UNDERLINE_START + pixel, {
        x: 148 + (pixel / (UNDERLINE_COUNT - 1)) * 765,
        y: 292
      });
    }
    for (let pixel = 0; pixel < FLAG_COUNT; pixel += 1) {
      coordinateMap.set(FLAG_START + pixel, {
        x: 88,
        y: 292 - (pixel / (FLAG_COUNT - 1)) * 222
      });
    }
    return coordinateMap;
  }

  const coordinates = buildCoordinates();
  const originPixels = [...PIXEL_STARTS, FLAG_START, UNDERLINE_START];

  function parseRecording(buffer) {
    const view = new DataView(buffer);
    const magic = new TextDecoder().decode(new Uint8Array(buffer, 0, 7));
    if (magic !== "BRC3PO1") throw new Error("Unrecognized recording format");
    const pixelCount = view.getUint32(8, true);
    const frameCount = view.getUint32(12, true);
    const duration = view.getUint32(16, true);
    const defaultBrightness = view.getUint32(20, true);
    const frameStride = 4 + pixelCount * 3;
    const expectedBytes = HEADER_BYTES + frameStride * frameCount;
    if (buffer.byteLength !== expectedBytes) throw new Error("Incomplete recording");

    const times = new Uint32Array(frameCount);
    for (let frame = 0; frame < frameCount; frame += 1) {
      times[frame] = view.getUint32(HEADER_BYTES + frame * frameStride, true);
    }
    return { buffer, view, pixelCount, frameCount, duration, defaultBrightness, frameStride, times };
  }

  function frameForTime(time) {
    if (!recording) return 0;
    let low = 0;
    let high = recording.frameCount - 1;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      if (recording.times[middle] <= time) low = middle;
      else high = middle - 1;
    }
    return low;
  }

  function pixelColor(frame, pixel) {
    const base = HEADER_BYTES + frame * recording.frameStride + 4 + pixel * 3;
    const brightness = Number(brightnessInput.value) / 255;
    return [
      Math.round(recording.view.getUint8(base) * brightness),
      Math.round(recording.view.getUint8(base + 1) * brightness),
      Math.round(recording.view.getUint8(base + 2) * brightness)
    ];
  }

  function draw() {
    const width = 1000;
    const height = 370;
    context.clearRect(0, 0, width, height);
    context.fillStyle = "#08090b";
    context.fillRect(0, 0, width, height);

    context.fillStyle = "#2b2e35";
    coordinates.forEach(point => {
      context.beginPath();
      context.arc(point.x, point.y, 2.45, 0, Math.PI * 2);
      context.fill();
    });

    if (recording) {
      const frame = frameForTime(currentTime);
      coordinates.forEach((point, pixel) => {
        if (pixel >= recording.pixelCount) return;
        const [red, green, blue] = pixelColor(frame, pixel);
        if (red + green + blue < 3) return;
        context.fillStyle = `rgb(${red},${green},${blue})`;
        context.beginPath();
        context.arc(point.x, point.y, 3.15, 0, Math.PI * 2);
        context.fill();
      });
    }

    context.fillStyle = "#777d88";
    context.font = "500 15px system-ui";
    context.textAlign = "center";
    LABELS.forEach((label, index) => context.fillText(label, 196 + index * 132, 332));
    context.fillText("FLAG", 88, 332);

    if (originsInput.checked) {
      context.strokeStyle = "#ffffff";
      context.fillStyle = "#ffffff";
      context.font = "500 11px system-ui";
      originPixels.forEach(pixel => {
        const point = coordinates.get(pixel);
        if (!point) return;
        context.beginPath();
        context.arc(point.x, point.y, 6, 0, Math.PI * 2);
        context.stroke();
        context.fillText("0", point.x + 10, point.y - 7);
      });
    }
  }

  function updateStatus() {
    if (!recording) return;
    const frame = frameForTime(currentTime);
    status.textContent = `${(currentTime / 1000).toFixed(2)} / ${(recording.duration / 1000).toFixed(2)} s · frame ${frame + 1}/${recording.frameCount}`;
    timeline.value = String(Math.round(currentTime));
  }

  function pause() {
    playing = false;
    playButton.textContent = "Play";
    cancelAnimationFrame(animationRequest);
  }

  function tick(now) {
    if (!playing || !recording) return;
    const speed = Number(speedInput.value);
    currentTime = timeAnchor + (now - playbackAnchor) * speed;
    if (currentTime >= recording.duration) {
      currentTime = recording.duration;
      pause();
    }
    draw();
    updateStatus();
    if (playing) animationRequest = requestAnimationFrame(tick);
  }

  async function loadPattern(id) {
    pause();
    message.textContent = "Loading recording…";
    try {
      const response = await fetch(`generated/${id}.bin`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      recording = parseRecording(await response.arrayBuffer());
      brightnessInput.value = String(recording.defaultBrightness);
      brightnessValue.value = String(recording.defaultBrightness);
      currentTime = 0;
      timeline.max = String(recording.duration);
      timeline.value = "0";
      message.textContent = "";
      draw();
      updateStatus();
    } catch (error) {
      recording = null;
      status.textContent = "No recording";
      message.innerHTML = `Could not load frames. Run <code>./visualizer/run_visualizer.sh</code> first. (${error.message})`;
      draw();
    }
  }

  playButton.addEventListener("click", () => {
    if (!recording) return;
    if (playing) {
      pause();
      return;
    }
    if (currentTime >= recording.duration) currentTime = 0;
    playing = true;
    playButton.textContent = "Pause";
    playbackAnchor = performance.now();
    timeAnchor = currentTime;
    animationRequest = requestAnimationFrame(tick);
  });

  restartButton.addEventListener("click", () => {
    currentTime = 0;
    if (playing) {
      playbackAnchor = performance.now();
      timeAnchor = 0;
    }
    draw();
    updateStatus();
  });

  timeline.addEventListener("input", () => {
    currentTime = Number(timeline.value);
    if (playing) {
      playbackAnchor = performance.now();
      timeAnchor = currentTime;
    }
    draw();
    updateStatus();
  });

  speedInput.addEventListener("input", () => {
    speedValue.value = `${Number(speedInput.value).toFixed(2).replace(/\.00$/, "")}×`;
    if (playing) {
      timeAnchor = currentTime;
      playbackAnchor = performance.now();
    }
  });
  brightnessInput.addEventListener("input", () => {
    brightnessValue.value = brightnessInput.value;
    draw();
  });
  originsInput.addEventListener("change", draw);
  patternSelect.addEventListener("change", () => loadPattern(patternSelect.value));

  fetch("manifest.json")
    .then(response => response.json())
    .then(manifest => {
      manifest.patterns.forEach(pattern => {
        const option = document.createElement("option");
        option.value = pattern.id;
        option.textContent = pattern.label;
        patternSelect.appendChild(option);
      });
      return loadPattern(manifest.patterns[0].id);
    })
    .catch(error => {
      message.textContent = `Could not load manifest: ${error.message}`;
      draw();
    });

  draw();
})();
</script>
</body>
</html>
